name: Build and Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Run the (still Node 20) actions on Node 24, ahead of GitHub forcing it on
# 2026-06-16. Silences the deprecation warning without pinning unreleased versions.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Avoid overlapping deploys clobbering each other.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build

      - name: Deploy ./out to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./out/
          # This FTP account is rooted at the domain's web root (public_html),
          # so deploy into the login root directly — NOT ./public_html/ (which
          # would nest the site one level too deep at public_html/public_html/).
          server-dir: ./
          # Next.js randomizes the build ID every build, so the _next/ paths
          # churn each deploy. Incremental sync then tries to delete the previous
          # build's files and Hostinger's FTP errors with 550. A clean-slate
          # upload (wipe server-dir, upload fresh ./out) is deterministic and
          # avoids that. Trade-off: full upload each run + a brief window mid-deploy.
          dangerous-clean-slate: true
          # Hostinger's FTP control socket is slow to establish and occasionally
          # times out at the default 30s ("Timeout (control socket)"). Give it
          # more room to connect before failing.
          timeout: 120000
